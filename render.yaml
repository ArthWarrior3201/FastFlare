# One-click web hosting on Render (HTTP only: Render exposes no UDP, so the NTP server is off).
# Use tools/windows-sync.ps1 on Windows to take its time over HTTPS.
services:
  - type: web
    name: fastflare
    runtime: node
    plan: free
    buildCommand: npm install --no-audit --no-fund
    startCommand: node src/server.js
    healthCheckPath: /health
    envVars:
      - key: FF_SECRET
        generateValue: true
      - key: FF_NTP
        value: "0"
      - key: TRUST_PROXY
        value: "1"
